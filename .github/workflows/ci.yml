name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chartroom
          POSTGRES_PASSWORD: chartroom
          POSTGRES_DB: chartroom_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chartroom" --health-interval 3s --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.20.0
        ports: ["6333:6333"]
      redis:
        image: redis:8.2-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: make lint
      - run: uv run pytest --cov
      - run: make audit
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
