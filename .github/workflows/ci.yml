name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chartroom
          POSTGRES_PASSWORD: chartroom
          POSTGRES_DB: chartroom_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chartroom" --health-interval 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: make lint
      - run: uv run pytest --cov
