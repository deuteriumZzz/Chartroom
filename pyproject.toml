[project]
name = "chartroom"
version = "0.1.0"
description = "Ассистент по судовым процедурам и отчётам (демо RAG-сервис)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pyjwt>=2.15.1",
    "pwdlib[argon2]>=0.3.1",
    "python-multipart>=0.0.33",
    "pymupdf>=1.26,<2",
    "python-docx>=1.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.16",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chartroom"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
# У PyMuPDF часть API без аннотаций; строгость к нашему коду и остальным библиотекам не снижаем.
untyped_calls_exclude = ["pymupdf"]

[tool.importlinter]
root_package = "chartroom"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Слои модуля: api и adapters -> service -> ports -> domain"
type = "layers"
containers = ["chartroom.identity"]
layers = ["api | adapters", "service", "ports", "domain"]

[[tool.importlinter.contracts]]
name = "Ядро модуля не зависит от фреймворков и инфраструктуры"
type = "forbidden"
source_modules = ["chartroom.identity.domain", "chartroom.identity.ports", "chartroom.identity.service"]
forbidden_modules = ["fastapi", "pydantic", "sqlalchemy", "jwt", "pwdlib", "chartroom.shared.database", "chartroom.shared.config"]

[tool.coverage.run]
source = ["chartroom"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 95
exclude_also = ['if __name__ == "__main__":']

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Один event loop на сессию: engine (session-scope) и тесты должны жить в одном loop.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
# SWIG-обёртка PyMuPDF шумит при импорте на Python 3.12 — к нашему коду не относится.
filterwarnings = ["ignore:builtin type (swigvarlink|SwigPyPacked|SwigPyObject) has no __module__:DeprecationWarning"]
