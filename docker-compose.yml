services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: chartroom
      POSTGRES_PASSWORD: chartroom
      POSTGRES_DB: chartroom
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chartroom"]
      interval: 3s
      retries: 10
  api:
    build: .
    # .env.example — демо-значения для запуска одной командой; .env (если есть) их перекрывает
    env_file:
      - path: .env.example
      - path: .env
        required: false
    ports: ["${API_PORT:-8088}:8000"]
    # Без проверки `up --wait` считает API готовым сразу после старта контейнера,
    # ещё до миграций и запуска uvicorn.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      retries: 20
    depends_on:
      db: {condition: service_healthy}
volumes:
  pgdata:
