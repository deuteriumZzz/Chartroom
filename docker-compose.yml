services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: chartroom
      POSTGRES_PASSWORD: chartroom
      POSTGRES_DB: chartroom
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chartroom"]
      interval: 3s
      retries: 10
  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports: ["6333:6333"]
    volumes: [qdrant:/qdrant/storage]
    healthcheck:
      # В образе нет curl: проверяем, что порт принимает соединения.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 3s
      retries: 10
  redis:
    image: redis:8.2-alpine
    ports: ["6379:6379"]  # для интеграционных тестов лимитера (make test)
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 10
  api:
    build: .
    image: chartroom:local  # один образ на api и worker: собирается один раз
    # .env.example — демо-значения для запуска одной командой; .env (если есть) их перекрывает
    env_file:
      - path: .env.example
      - path: .env
        required: false
    ports: ["${API_PORT:-8088}:8000"]
    # Без проверки `up --wait` считает API готовым сразу после старта контейнера,
    # ещё до миграций и запуска uvicorn.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      retries: 20
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  worker:
    image: chartroom:local
    pull_policy: never  # образ собирает сервис api
    # Один процесс: каждый процесс Celery загружает приложение целиком, а нагрузка демо мала.
    command: ["celery", "-A", "chartroom.worker", "worker", "--loglevel=INFO", "--concurrency=1"]
    env_file:
      - path: .env.example
      - path: .env
        required: false
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_healthy}
volumes:
  pgdata:
  qdrant:
